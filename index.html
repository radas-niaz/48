{cat:'Voltage drop (Table D3) · Q19',text:'Using Table D3, determine the maximum distance a #8 RW90XLPE copper conductor, installed in raceway, can be run to supply a 32 A load on a 120/240 V, 1Ø branch circuit. (Use 80% pf.)',

/* ---------- QUIZ ENGINE ---------- */
let Q=[],idx=0,score=0,log=[],hinted=false;
const norm=s=>String(s).toLowerCase().replace(/[\s().]/g,'');
const nrule=s=>String(s).toLowerCase().replace(/\s/g,'').replace(/[–—−]/g,'-');
function build(){
  const s=shuf(SF).slice(0,12).map(x=>({cat:'Search and find',sf:true,text:x[0],rule:x[1],sub:x[2],why:x[3],hint:x[4]}));
  const c=[].concat(...[VD,AM,RW,BX].map(l=>shuf(l).slice(0,2)));
  Q=shuf(s.concat(c));idx=0;score=0;log=[];
}
function home(){
  $('app').innerHTML=`<h1>CEC Midterm Practice Quiz</h1><p class="mu">ELEC-1051 Residential Electrical Code 1 · based on CSA C22.1:24 (Part I, 26th edition)</p>
  <div class="card"><b>20 random questions</b><ul><li>12 search and find (Sections 0, 2, 4, 8, 10, 12): give the rule number and subrule</li><li>2 voltage drop using Table D3</li><li>2 ampacity calculations</li><li>2 raceway fill</li><li>2 box fill</li></ul>
  <p class="mu">All questions come from your Module 5 midterm review pages (66–72). Calculation questions use the same numbers as the practice sheet.</p><p class="mu">Rule format: <b>12-3000</b>, subrule: <b>6)</b> or <b>1)b)</b>. Leave subrule blank if the rule has no subrule. Section 0 answers: type <b>0</b>.</p>
  <button onclick="start()">Start quiz</button></div>`;
}
function start(){build();show()}
function show(){
  const q=Q[idx];hinted=false;
  let f='';
  if(q.sf){
    f=`<label>Rule number (e.g. 12-3000)</label><input id="f0" autocomplete="off" autocapitalize="off">
    <label>Subrule (e.g. 6) or 1)b), blank if none)</label><input id="f1" autocomplete="off" autocapitalize="off">`;
  }else q.fields.forEach((x,i)=>{
    f+=`<label>${x.label}</label>`+(x.t==='select'?`<select id="f${i}"><option value="">Choose…</option>${x.opts.map(o=>`<option>${o}</option>`).join('')}</select>`:`<input id="f${i}" inputmode="decimal" autocomplete="off">`);
  });
  $('app').innerHTML=`<div class="bar"><i style="width:${idx/20*100}%"></i></div>
  <p class="mu">Question ${idx+1} of 20 · Score so far: ${score}</p>
  <div class="card"><span class="tag">${q.cat}</span><div class="q" style="white-space:pre-wrap">${q.text}</div>${f}
  <div class="row" id="btns"><button id="sub" onclick="check()">Submit</button>${q.sf?'<button class="sec" onclick="hint()">Hint</button>':''}</div>
  <div id="hint"></div><div id="out"></div></div>`;
  $('f0').focus();
}
function hint(){$('hint').innerHTML=`<div class="hint">🔎 ${Q[idx].hint}</div>`}
function ok(x,v){
  if(x.t==='select')return v===String(x.ans);
  const n=parseFloat(v);return !isNaN(n)&&[x.ans].concat(x.alt||[]).some(a=>Math.abs(n-a)<=x.tol);
}
function check(){
  const q=Q[idx];let pts=0,msg='',ans='';
  if(q.sf){
    const r=nrule($('f0').value),s=norm($('f1').value);
    const rr=q.rule==='0'?['0','section0','definitions','section0definitions'].includes(r):r===nrule(q.rule);
    const sr=s===norm(q.sub);
    pts=(rr?.5:0)+(sr?.5:0);
    ans=`Answer: ${q.rule==='0'?'Section 0 (Definitions)':'Rule '+q.rule}${q.sub?' '+q.sub:' (no subrule)'}\n${q.why}`;
    msg=pts===1?'Correct':pts===.5?(rr?'Right rule, subrule not right':'Subrule matches, rule number not right'):'Not quite';
  }else{
    let g=0;q.fields.forEach((x,i)=>{if(ok(x,$('f'+i).value.trim()))g++});
    pts=g/q.fields.length;
    ans=`Answer: ${q.fields.map(x=>x.label+' = '+x.ans).join(' · ')}\n\n${q.why}`;
    msg=pts===1?'Correct':pts>0?'Partly correct':'Not quite';
  }
  score+=pts;log.push({q,pts,ans});
  $('sub').disabled=true;
  $('out').innerHTML=`<div class="fb ${pts===1?'ok':pts>0?'wa':'no'}"><b>${msg}</b>\n${ans}</div>
  <div class="row"><button onclick="next()">${idx===19?'See results':'Next question'}</button></div>`;
}
function next(){idx++;idx>=20?done():show()}
function done(){
  const pct=Math.round(score/20*100),miss=log.filter(l=>l.pts<1);
  $('app').innerHTML=`<h1>Results</h1><div class="card"><div class="sc">${score%1?score.toFixed(1):score} / 20 (${pct}%)</div>
  <p class="mu">${pct>=80?'Strong. Keep drilling the ones you missed.':pct>=60?'Getting there. Practise the missed categories.':'Keep at it. Go back through the index and tables.'}</p>
  <div class="row"><button onclick="start()">New random quiz</button><button class="sec" onclick="home()">Home</button></div></div>
  <div class="card"><b>Review: ${miss.length} to look at</b>${miss.map(l=>`<div class="rev"><span class="tag">${l.q.cat}</span><div style="white-space:pre-wrap;margin:6px 0">${l.q.text}</div><div class="mu" style="white-space:pre-wrap">${l.ans}</div></div>`).join('')||'<p>Perfect score, nothing to review.</p>'}</div>`;
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const s=$('sub'),n=document.querySelector('#out button');if(n)n.click();else if(s&&!s.disabled)s.click()}});
home();
</script></body></html>
